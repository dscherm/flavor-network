<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0d1f38" rx="6"/>
  <!-- Three orbits centered at (16, 18), rotated 0/60/-60 -->
  <g fill="none" stroke="#ffffff" stroke-width="1.1">
    <ellipse cx="16" cy="18" rx="11" ry="4.5"/>
    <ellipse cx="16" cy="18" rx="11" ry="4.5" transform="rotate(60 16 18)"/>
    <ellipse cx="16" cy="18" rx="11" ry="4.5" transform="rotate(-60 16 18)"/>
  </g>
  <!-- Chef hat: tiny stylized version above the atom -->
  <path
    d="M 11 9 Q 9 6 11 4 Q 11 2 13 2 Q 13 1 16 1 Q 19 1 19 2 Q 21 2 21 4 Q 23 6 21 9 L 21 11 Q 21 12 20 12 L 12 12 Q 11 12 11 11 Z"
    fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- Center "Nf" -->
  <text x="16" y="21" text-anchor="middle" font-size="6.5" font-weight="700"
        fill="#ffffff" font-family="Inter, system-ui, sans-serif" letter-spacing="-0.3">Nf</text>
  <!-- Tiny static dots (white + orange) to nod at the source mark -->
  <circle cx="16" cy="14.5" r="0.85" fill="#e8f3ff"/>
  <circle cx="16" cy="21.5" r="0.85" fill="#ff8c42"/>
</svg>
