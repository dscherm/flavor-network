workflows:
  ios-testflight:
    name: iOS TestFlight build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect_key
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.neuralflavor.app"
        APP_STORE_APPLE_ID: 6760793304
      node: 20.11.0
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web bundle
        script: |
          npm run build
      - name: Sync Capacitor + strip iOS bundle
        script: |
          npx cap sync ios
          node scripts/strip-ios-bundle.mjs
          # Belt + suspenders: if cap sync was last run on Windows it
          # would write backslash path separators (Swift treats \ as
          # escape chars). Restore forward slashes on lines containing
          # path: "..." entries so SPM can resolve the local plugin
          # packages.
          python3 -c "import re,sys; p='ios/App/CapApp-SPM/Package.swift'; c=open(p).read(); c=re.sub(r'path:\s*\"([^\"]*)\"', lambda m: 'path: \"'+m.group(1).replace('\\\\','/')+'\"', c); open(p,'w').write(c)"
      - name: Resolve SPM packages
        script: |
          # Capacitor 8 SPM-only project: xcodebuild can't read build
          # settings until the local CapApp-SPM package is resolved.
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies \
            -skipPackagePluginValidation
      - name: Set up code signing
        script: |
          keychain initialize
          # Mint a fresh iOS Distribution certificate on the Codemagic
          # build server. Existing certificates on App Store Connect
          # can be listed via the API but their private keys live on
          # whichever Mac generated them — so they're unusable here.
          # --save persists the new private key to this build's keychain.
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save || true
          # Fetch (or create) a matching App Store provisioning profile
          # for this bundle ID. Requires the bundle ID to be registered
          # at developer.apple.com → Identifiers first.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          agvtool new-version -all $NEW_BUILD_NUMBER
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
