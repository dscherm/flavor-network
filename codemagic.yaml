workflows:
  ios-testflight:
    name: iOS TestFlight build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect_key
    environment:
      # NOTE (2026-08-02): the `ios_signing:` block was REMOVED. It ran during
      # "Preparing build machine" — before any script — and fetched signing
      # files WITHOUT creating them, so once the profiles were deleted while
      # chasing the Sign-In-with-Apple entitlement it failed the whole build
      # with:
      #
      #     No matching profiles found for bundle identifier
      #     "com.neuralflavor.app" and distribution type "app_store"
      #
      # Verified in the Codemagic UI: Settings -> Code signing identities has
      # NO certificates and NO profiles stored. So there was nothing local to
      # pair a fetched profile against, and nothing in that block could create
      # one. Signing now happens explicitly in a script step below, where
      # --create can mint whatever is missing.
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.neuralflavor.app"
        APP_STORE_APPLE_ID: 6760793304
      node: 22.11.0
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web bundle
        script: |
          npm run build
      - name: Sync Capacitor + strip iOS bundle
        script: |
          set -e
          npx cap sync ios
          node scripts/strip-ios-bundle.mjs
          # Belt + suspenders: if cap sync was last run on Windows it
          # would write backslash path separators (Swift treats \ as
          # escape chars). Restore forward slashes on lines containing
          # path: "..." entries so SPM can resolve the local plugin
          # packages.
          python3 -c "import re,sys; p='ios/App/CapApp-SPM/Package.swift'; c=open(p).read(); c=re.sub(r'path:\s*\"([^\"]*)\"', lambda m: 'path: \"'+m.group(1).replace('\\\\','/')+'\"', c); open(p,'w').write(c)"
          # Verify cap sync actually produced the resources xcodebuild
          # expects. These three are referenced from project.pbxproj as
          # bundle resources; if any is missing the archive step fails
          # silently with "couldn't be opened because there is no such
          # file" only after a 5-min compile cycle. Fail fast here
          # instead.
          echo "--- ios/App/App/ contents ---"
          ls -la ios/App/App/
          test -d ios/App/App/public || (echo "MISSING: ios/App/App/public" && exit 1)
          test -f ios/App/App/capacitor.config.json || (echo "MISSING: ios/App/App/capacitor.config.json" && exit 1)
          test -f ios/App/App/config.xml || (echo "MISSING: ios/App/App/config.xml" && exit 1)
          echo "Cap sync output verified."
      - name: Resolve SPM packages
        script: |
          # Capacitor 8 SPM-only project: xcodebuild can't read build
          # settings until the local CapApp-SPM package is resolved.
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies \
            -skipPackagePluginValidation
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          # Use get-latest-build-number (checks BOTH App Store + TestFlight)
          # — get-latest-app-store-build-number only checks released
          # versions and returns 0 for unreleased apps, even when
          # TestFlight builds exist.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Latest build on Apple's side: $LATEST_BUILD_NUMBER -> uploading as $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER
      - name: Set up code signing
        script: |
          set -e
          # Explicit signing, replacing the removed `ios_signing:` block.
          # --create is the whole point: it mints the distribution
          # certificate and/or the App Store provisioning profile if either
          # is missing, and pairs them by construction. That makes the
          # pipeline self-healing — deleting a profile in Apple's portal (as
          # happened when the Sign In with Apple capability invalidated them
          # all) can no longer dead-end a build.
          #
          # Requires the app_store_connect integration above, which supplies
          # the API key env vars. The key must be App Manager or Admin to
          # create; this one is App Manager.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          # build-ipa needs export_options.plist, which only use-profiles
          # writes.
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
